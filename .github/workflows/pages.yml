name: Deploy Wishly Guide (Next.js Static Export)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate SEO assets
        run: python scripts/build-seo-assets.py
      - name: Validate SEO and project assets
        run: python scripts/validate-project.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate page metadata
        run: npm run validate:metadata
      - name: Build static site
        run: npm run build
      - name: Type check generated route types
        run: npm run typecheck
      - name: Verify static export
        run: test -f out/index.html && test -f out/404.html && test -f out/sitemap.xml && test -f out/sitemap-index.xml && test -f out/video-sitemap.xml && test -f out/feed.xml && test -f out/bn/feed.xml
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
